<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <title>ZEV Logo</title>
  <style>
    .zev-wing-top {
      transform-box: fill-box;
      transform-origin: left center;
      animation: zev-enter-top 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .zev-wing-bottom {
      transform-box: fill-box;
      transform-origin: right center;
      animation: zev-enter-bottom 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both;
    }
    .zev-blade {
      transform-box: fill-box;
      transform-origin: center;
      animation: zev-enter-blade 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .zev-sheen {
      animation: zev-sheen-pulse 4.8s ease-in-out infinite;
    }
    @keyframes zev-enter-top {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes zev-enter-bottom {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes zev-enter-blade {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes zev-sheen-pulse {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 0.68; }
    }
    @media (prefers-reduced-motion: reduce) {
      .zev-wing-top, .zev-wing-bottom, .zev-blade, .zev-sheen {
        animation: none;
      }
    }
  </style>
  <!-- Zev Folded Z-Monolith 精密折面动态矢量标 -->
  <polygon class="zev-wing-top" points="15.8,23.2 90.5,23.2 70.9,38.8 24.1,38.8" fill="#2b313c" />
  <polygon class="zev-wing-bottom" points="29.5,96.8 104.2,96.8 95.9,81.2 49.1,81.2" fill="#2b313c" />
  <g class="zev-blade">
    <polygon class="zev-sheen" points="15.8,84.3 92.2,23.2 104.2,23.2 15.8,96.8" fill="#cbd5e1" />
    <polygon points="104.2,23.2 104.2,35.7 27.8,96.8 15.8,96.8" fill="#64748b" />
  </g>
</svg>
