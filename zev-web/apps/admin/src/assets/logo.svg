<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Color Shifting Gradient -->
    <linearGradient id="geek-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9; #8b5cf6; #0ea5e9" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1; #ec4899; #6366f1" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <linearGradient id="lock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <style>
    /* Continuous animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    @keyframes stream { to { stroke-dashoffset: -26; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(14px); opacity: 0; }
    }

    /* Base element styling */
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    .delay-1 { animation-delay: 0s; }
    .delay-2 { animation-delay: 0.7s; }
    .delay-3 { animation-delay: 1.4s; }
    .delay-4 { animation-delay: 2.1s; }

    .orbit {
      opacity: 0.15;
      transition: all 0.5s ease;
    }
    .orbit-1 { transform-origin: 20px 20px; animation: spin 8s linear infinite; }
    .orbit-2 { transform-origin: 80px 20px; animation: spin-reverse 6s linear infinite; }
    .orbit-3 { transform-origin: 20px 80px; animation: spin-reverse 7s linear infinite; }
    .orbit-4 { transform-origin: 80px 80px; animation: spin 5s linear infinite; }

    .data-stream {
      stroke-dasharray: 1 12;
      animation: stream 1.5s linear infinite;
      transition: all 0.4s ease;
    }

    .lock-wrapper {
      animation: float 4s infinite ease-in-out;
      transform-origin: 50px 50px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .scan-line { opacity: 0; transition: opacity 0.3s; }
    .packet { opacity: 0.6; transition: opacity 0.3s; }

    /* Interactive Hover Effects */
    .hover-layer { cursor: pointer; }
    
    svg:hover .orbit { opacity: 0.8; stroke-width: 2; stroke-dasharray: 6 4; }
    svg:hover .orbit-1 { animation-duration: 3s; }
    svg:hover .orbit-2 { animation-duration: 2s; }
    svg:hover .orbit-3 { animation-duration: 2.5s; }
    svg:hover .orbit-4 { animation-duration: 1.5s; }
    
    svg:hover .data-stream { animation-duration: 0.4s; stroke-width: 6; stroke-dasharray: 2 15; }
    
    svg:hover .lock-wrapper { transform: scale(1.15) translateY(-2px); }
    svg:hover .scan-line { animation: scan 1.2s infinite linear; }
    
    svg:hover .packet { opacity: 1; }
    
    .node-interactive { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    svg:hover .ni-1 { transform: translate(-3px, -3px); }
    svg:hover .ni-2 { transform: translate(3px, -3px); }
    svg:hover .ni-3 { transform: translate(-3px, 3px); }
    svg:hover .ni-4 { transform: translate(3px, 3px); }
  </style>

  <!-- Foundation Line -->
  <path d="M20 20 L80 20 L20 80 L80 80" stroke="url(#geek-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" />
  
  <!-- Active Flowing Data Stream -->
  <path class="data-stream" d="M20 20 L80 20 L20 80 L80 80" stroke="url(#geek-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The 4 System Nodes with Orbits -->
  <g class="node-interactive ni-1">
    <circle class="orbit orbit-1" cx="20" cy="20" r="15" fill="none" stroke="url(#geek-grad)" stroke-dasharray="3 4" stroke-width="1.5" />
    <circle class="node-pulse delay-1" cx="20" cy="20" r="8" fill="url(#geek-grad)" />
  </g>
  
  <g class="node-interactive ni-2">
    <circle class="orbit orbit-2" cx="80" cy="20" r="14" fill="none" stroke="url(#geek-grad)" stroke-dasharray="4 4" stroke-width="1.5" />
    <circle class="node-pulse delay-2" cx="80" cy="20" r="8" fill="url(#geek-grad)" />
  </g>
  
  <g class="node-interactive ni-3">
    <circle class="orbit orbit-3" cx="20" cy="80" r="16" fill="none" stroke="url(#geek-grad)" stroke-dasharray="2 5" stroke-width="1.5" />
    <circle class="node-pulse delay-3" cx="20" cy="80" r="8" fill="url(#geek-grad)" />
  </g>
  
  <g class="node-interactive ni-4">
    <circle class="orbit orbit-4" cx="80" cy="80" r="13" fill="none" stroke="url(#geek-grad)" stroke-dasharray="5 3" stroke-width="1.5" />
    <circle class="node-pulse delay-4" cx="80" cy="80" r="8" fill="url(#geek-grad)" />
  </g>
  
  <!-- Data Packets (Multiple flowing nodes) -->
  <circle class="packet" cx="0" cy="0" r="3.5" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M20 20 L80 20 L20 80 L80 80" />
  </circle>
  <circle class="packet" cx="0" cy="0" r="2.5" fill="#0ea5e9" filter="url(#glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M80 80 L20 80 L80 20 L20 20" /> <!-- Reversed direction! -->
  </circle>

  <!-- Central RBAC Lock -->
  <g class="lock-wrapper" filter="url(#shadow)">
    <!-- Lock Body -->
    <rect x="40" y="43" width="20" height="15" rx="3" fill="url(#lock-grad)" />
    <!-- Lock Shackle -->
    <path d="M44 43 V38 C44 33 56 33 56 38 V43" stroke="url(#lock-grad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Keyhole -->
    <circle cx="50" cy="49" r="2.5" fill="#ffffff" />
    <path d="M49 50 L48 55 H52 L51 50 Z" fill="#ffffff" />
    
    <!-- Cyberpunk Scan Line -->
    <line class="scan-line" x1="41" y1="43" x2="59" y2="43" stroke="#ffffff" stroke-width="1" filter="url(#glow)" />
  </g>

  <!-- Invisible hit area for easier hovering over the whole logo -->
  <rect class="hover-layer" x="0" y="0" width="100" height="100" fill="transparent" />
</svg>
