
services:
  db:
    extends:
      file: ./zev-go/docker-compose-db.yml
      service: db

  # Backend service
  backend:
    build:
      context: ./zev-go
      target: dev
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=zev
      - DB_PASSWORD=password
      - DB_NAME=zev
      - DB_PORT=5432
    volumes:
      - ./zev-go:/app
    depends_on:
      - db
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./zev-web
      target: dev
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://backend:8080
      - CHOKIDAR_USEPOLLING=true
      - CI=true
    volumes:
      - ./zev-web:/app
      - /app/node_modules
      - /app/apps/admin/node_modules
      - /app/packages/ui/node_modules
    restart: unless-stopped
    stdin_open: true

volumes:
  db-data:
