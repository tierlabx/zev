# 容器专用 Air 配置：将编译产物隔离到容器内 /tmp/air，避免与 Windows 宿主机 tmp/main.exe 互相覆盖
root = "."
tmp_dir = "/tmp/air"

[build]
  bin = "/tmp/air/main"
  cmd = "go build -o /tmp/air/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "logs"]
  exclude_file = ["pkg/swagger/docs_crud_generated.go"]
  exclude_regex = ["_test.go", "_generated.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "/tmp/air/build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
